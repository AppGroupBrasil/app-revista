<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>App Revista</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1E3A5F; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Carregando App Revista…</p>
  </div>
  <script>
    setTimeout(function () { window.location.href = 'https://apprevista.com.br'; }, 200);
  </script>
</body>
</html>
